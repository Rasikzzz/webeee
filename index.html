<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William · Advanced Analytics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ---------- PROFESSIONAL DARK/LIGHT THEME ---------- */
        :root {
            --bg: #f4f7fc;
            --card-bg: #ffffff;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --border: #e2e8f0;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --accent: #3182ce;
            --accent-light: #ebf4ff;
        }
        body.dark {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --accent: #3b82f6;
            --accent-light: #1e293b;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', 'Segoe UI', sans-serif; }
        body { background:var(--bg); padding:20px; transition: all 0.3s ease; color:var(--text-primary); }
        .container { max-width:1600px; margin:auto; }

        /* ---------- HEADER ---------- */
        .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; margin-bottom:25px; }
        .header-left { display:flex; align-items:center; gap:15px; }
        .header-left h1 { font-size:1.8rem; font-weight:700; background:linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .header-left .live-badge { background:#10b981; color:#fff; font-size:0.65rem; padding:3px 10px; border-radius:30px; -webkit-text-fill-color:#fff; }
        .header-right { display:flex; align-items:center; gap:15px; flex-wrap:wrap; }
        .header-right .update-time { font-size:0.8rem; color:var(--text-secondary); }
        .btn { padding:8px 18px; border:none; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; font-weight:600; transition:0.2s; }
        .btn:hover { opacity:0.8; transform:scale(0.98); }
        .theme-toggle { background:var(--card-bg); border:1px solid var(--border); border-radius:50%; width:40px; height:40px; cursor:pointer; font-size:1.2rem; display:flex; align-items:center; justify-content:center; color:var(--text-primary); }

        /* ---------- INSIGHTS BANNER ---------- */
        .insights-banner { background:var(--accent-light); border-left:4px solid var(--accent); padding:12px 20px; border-radius:8px; margin-bottom:25px; display:flex; flex-wrap:wrap; align-items:center; gap:15px; }
        .insights-banner i { color:var(--accent); font-size:1.2rem; }
        .insights-banner .text { font-size:0.95rem; color:var(--text-secondary); flex:1; }
        .insights-banner .text strong { color:var(--text-primary); }

        /* ---------- KPI GRID ---------- */
        .kpi-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:25px; }
        .kpi-card { background:var(--card-bg); padding:14px 16px; border-radius:10px; box-shadow:var(--shadow); border:1px solid var(--border); }
        .kpi-card .value { font-size:1.8rem; font-weight:700; line-height:1.2; }
        .kpi-card .label { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary); margin-top:4px; }
        .kpi-card .trend { font-size:0.7rem; margin-left:6px; font-weight:600; }
        .trend.up { color:#10b981; }
        .trend.down { color:#ef4444; }

        /* ---------- CHART GRID ---------- */
        .chart-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap:20px; margin-bottom:25px; }
        .chart-card { background:var(--card-bg); padding:18px; border-radius:12px; border:1px solid var(--border); box-shadow:var(--shadow); }
        .chart-card h3 { font-size:0.9rem; font-weight:600; margin-bottom:12px; color:var(--text-secondary); display:flex; align-items:center; gap:8px; }
        .chart-card canvas { max-height:200px; max-width:100%; }

        /* ---------- TABLE ---------- */
        .table-wrapper { background:var(--card-bg); border-radius:12px; border:1px solid var(--border); padding:18px; margin-top:20px; overflow-x:auto; }
        .table-toolbar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:15px; margin-bottom:15px; }
        .table-toolbar input { background:var(--bg); border:1px solid var(--border); padding:8px 14px; border-radius:8px; color:var(--text-primary); width:260px; }
        .table-toolbar span { font-size:0.8rem; color:var(--text-secondary); align-self:center; }
        table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        th { text-align:left; padding:10px 8px; border-bottom:2px solid var(--border); color:var(--text-secondary); font-weight:600; }
        td { padding:8px; border-bottom:1px solid var(--border); }
        tr:hover { background:var(--accent-light); }
        .badge { padding:2px 12px; border-radius:30px; font-size:0.7rem; font-weight:600; }
        .badge-success { background:#10b98120; color:#10b981; }
        .badge-warning { background:#f59e0b20; color:#f59e0b; }
        .badge-danger { background:#ef444420; color:#ef4444; }
        .overdue-row { background: #ef444410; }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width:700px) { .kpi-grid { grid-template-columns:repeat(2,1fr); } }
        .loading, .error { padding:40px; text-align:center; color:var(--text-secondary); }
    </style>
</head>
<body>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <h1><i class="fas fa-brain" style="-webkit-text-fill-color:#3b82f6;"></i> William IQ</h1>
            <span class="live-badge"><i class="fas fa-circle" style="font-size:0.5rem; vertical-align:middle;"></i> LIVE</span>
        </div>
        <div class="header-right">
            <span class="update-time" id="lastUpdate">⏱️ --</span>
            <button class="btn" onclick="fetchData()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button class="theme-toggle" onclick="document.body.classList.toggle('dark')"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <!-- INSIGHTS BANNER (Dynamic) -->
    <div class="insights-banner" id="insightsBanner">
        <i class="fas fa-lightbulb"></i>
        <span class="text" id="insightText">Loading intelligence...</span>
    </div>

    <!-- KPI GRID -->
    <div class="kpi-grid" id="kpiGrid"></div>

    <!-- CHARTS -->
    <div class="chart-grid">
        <div class="chart-card"><h3>📅 Orders by Day of Week</h3><canvas id="dowChart"></canvas></div>
        <div class="chart-card"><h3>🏆 Top 5 Clients</h3><canvas id="topClientChart"></canvas></div>
        <div class="chart-card"><h3>📊 Order Forecast (Due Soon)</h3><canvas id="forecastChart"></canvas></div>
        <div class="chart-card"><h3>📍 State Distribution</h3><canvas id="stateChart"></canvas></div>
        <div class="chart-card"><h3>🔍 Inspection Mix</h3><canvas id="inspectionChart"></canvas></div>
        <div class="chart-card"><h3>📈 Monthly Trend</h3><canvas id="monthChart"></canvas></div>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
        <div class="table-toolbar">
            <input type="text" id="searchInput" placeholder="🔍 Search orders, addresses, clients...">
            <span id="rowCount">0 rows</span>
        </div>
        <div id="tableContainer"><div class="loading">Loading dataset...</div></div>
    </div>

</div>

<script>
// ---------- GLOBALS ----------
let allData = [];
let chartInstances = {};

// ---------- FETCH & RENDER ----------
async function fetchData() {
    document.getElementById('tableContainer').innerHTML = '<div class="loading">Loading...</div>';
    try {
        // ✅ UPDATED: Using your live backend URL
        const response = await fetch('https://insights.bpoautoaccept.com/api.php');
        if (!response.ok) throw new Error('Network error');
        const result = await response.json();
        if (result.status !== 'success') throw new Error(result.message);
        
        allData = result.data;
        const stats = result.stats;
        
        renderKPI(stats);
        renderInsights(stats);
        renderTable(allData);
        renderCharts(stats);
        document.getElementById('lastUpdate').textContent = '⏱️ ' + new Date().toLocaleTimeString();
    } catch (err) {
        document.getElementById('tableContainer').innerHTML = `<div class="error"><i class="fas fa-exclamation-triangle"></i> ${err.message}</div>`;
        console.error(err);
    }
}

// ---------- KPI RENDER ----------
function renderKPI(s) {
    const grid = document.getElementById('kpiGrid');
    grid.innerHTML = `
        <div class="kpi-card"><div class="value">${s.total}</div><div class="label">Total Orders</div></div>
        <div class="kpi-card"><div class="value">${s.mail_sent}</div><div class="label">Mail Sent</div></div>
        <div class="kpi-card"><div class="value">${s.mail_pending}</div><div class="label">Mail Pending</div></div>
        <div class="kpi-card" style="border-left:3px solid #ef4444;"><div class="value">${s.overdue}</div><div class="label">Overdue <span class="trend down">(${s.overdue_rate}%)</span></div></div>
        <div class="kpi-card"><div class="value">${s.unique_clients}</div><div class="label">Unique Clients</div></div>
        <div class="kpi-card"><div class="value">${s.avg_turnaround}</div><div class="label">Avg Turnaround (Days)</div></div>
        <div class="kpi-card"><div class="value">${s.overdue_mail_success}%</div><div class="label">Mail Success on Overdue</div></div>
        <div class="kpi-card"><div class="value">${Object.keys(s.states).length}</div><div class="label">States Covered</div></div>
    `;
}

// ---------- LOGICAL INSIGHTS (Text) ----------
function renderInsights(s) {
    const el = document.getElementById('insightText');
    const topClient = Object.keys(s.top_clients)[0] || 'N/A';
    const topClientCount = s.top_clients[topClient] || 0;
    const total = s.total || 1;
    const topPct = Math.round((topClientCount / total) * 100);
    
    // Find most common day
    const dowMap = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const maxDow = Math.max(...s.day_of_week);
    const peakDay = dowMap[s.day_of_week.indexOf(maxDow)] || 'N/A';
    
    let insight = `<strong>📊 Key Relationships:</strong> `;
    insight += `Top client <strong>${topClient}</strong> accounts for ${topPct}% of volume. `;
    insight += `Peak order day is <strong>${peakDay}</strong>. `;
    if (s.overdue_rate > 20) {
        insight += `⚠️ <strong>${s.overdue_rate}% overdue</strong> – consider prioritizing mail follow-ups. `;
    } else {
        insight += `✅ Overdue rate is low at ${s.overdue_rate}%. `;
    }
    if (s.overdue_mail_success < 70 && s.overdue > 0) {
        insight += `🔴 Overdue orders have only <strong>${s.overdue_mail_success}%</strong> mail sent rate (vs average). `;
    }
    insight += `Average turnaround from assigned to due is <strong>${s.avg_turnaround} days</strong>.`;
    el.innerHTML = insight;
}

// ---------- TABLE RENDER ----------
function renderTable(data) {
    const container = document.getElementById('tableContainer');
    document.getElementById('rowCount').textContent = `${data.length} rows`;
    if (data.length === 0) { container.innerHTML = '<p style="padding:20px;text-align:center;">No records.</p>'; return; }

    let html = `<table><thead><tr>
        <th>ID</th><th>Order</th><th>Address</th><th>Client</th><th>Assigned</th><th>Due</th><th>Inspection</th><th>Item</th><th>Mail</th>
    </tr></thead><tbody>`;
    data.forEach(row => {
        // Use the correct date format for comparison
        const dueDate = row.due ? new Date(row.due) : null;
        const isOverdue = dueDate && dueDate < new Date();
        const mailBadge = row.mail_sent == 1 ? '<span class="badge badge-success">Sent</span>' : '<span class="badge badge-warning">Pending</span>';
        const dueClass = isOverdue ? ' class="overdue-row"' : '';
        html += `<tr${dueClass}>
            <td>${row.id}</td><td>${esc(row.order_id)}</td><td>${esc(row.address)}</td>
            <td><strong>${esc(row.client)}</strong></td><td>${esc(row.assigned)}</td>
            <td>${esc(row.due)}</td><td>${esc(row.inspection)}</td><td>${esc(row.item)}</td>
            <td>${mailBadge}</td>
        </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}
function esc(t) { if (!t) return ''; return String(t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]); }

// ---------- CHARTS RENDER ----------
function renderCharts(s) {
    const colors = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6'];

    // 1. Day of Week
    const dowLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    if (chartInstances.dow) chartInstances.dow.destroy();
    chartInstances.dow = new Chart(document.getElementById('dowChart'), {
        type: 'bar',
        data: { labels: dowLabels, datasets: [{ label: 'Orders', data: s.day_of_week, backgroundColor: colors[0] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });

    // 2. Top Clients
    const clientLabels = Object.keys(s.top_clients);
    const clientData = Object.values(s.top_clients);
    if (chartInstances.topClients) chartInstances.topClients.destroy();
    chartInstances.topClients = new Chart(document.getElementById('topClientChart'), {
        type: 'bar',
        data: { labels: clientLabels, datasets: [{ label: 'Orders', data: clientData, backgroundColor: colors[1] }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });

    // 3. Forecast
    const forecastLabels = ['0-7 Days','8-14 Days','15-30 Days','30+ Days'];
    const forecastData = [s.due_forecast['0-7'], s.due_forecast['8-14'], s.due_forecast['15-30'], s.due_forecast['30+']];
    if (chartInstances.forecast) chartInstances.forecast.destroy();
    chartInstances.forecast = new Chart(document.getElementById('forecastChart'), {
        type: 'doughnut',
        data: { labels: forecastLabels, datasets: [{ data: forecastData, backgroundColor: ['#ef4444','#f59e0b','#3b82f6','#10b981'] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });

    // 4. State Distribution
    const stateLabels = Object.keys(s.states).slice(0, 8);
    const stateData = Object.values(s.states).slice(0, 8);
    if (chartInstances.state) chartInstances.state.destroy();
    chartInstances.state = new Chart(document.getElementById('stateChart'), {
        type: 'bar',
        data: { labels: stateLabels, datasets: [{ label: 'Orders', data: stateData, backgroundColor: colors[2] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });

    // 5. Inspection Mix
    const inspLabels = Object.keys(s.inspection_types);
    const inspData = Object.values(s.inspection_types);
    if (chartInstances.inspection) chartInstances.inspection.destroy();
    chartInstances.inspection = new Chart(document.getElementById('inspectionChart'), {
        type: 'pie',
        data: { labels: inspLabels, datasets: [{ data: inspData, backgroundColor: colors.slice(0, inspLabels.length) }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });

    // 6. Monthly Trend
    const months = Object.keys(s.monthly);
    const monthData = Object.values(s.monthly);
    if (chartInstances.month) chartInstances.month.destroy();
    chartInstances.month = new Chart(document.getElementById('monthChart'), {
        type: 'line',
        data: { labels: months, datasets: [{ label: 'Orders', data: monthData, borderColor: '#3b82f6', tension: 0.3, fill: true, backgroundColor: 'rgba(59,130,246,0.1)' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
}

// ---------- SEARCH ----------
document.getElementById('searchInput').addEventListener('keyup', function() {
    const term = this.value.toLowerCase().trim();
    if (!term) return renderTable(allData);
    const filtered = allData.filter(r => 
        (r.order_id && r.order_id.toLowerCase().includes(term)) ||
        (r.address && r.address.toLowerCase().includes(term)) ||
        (r.client && r.client.toLowerCase().includes(term)) ||
        (r.item && r.item.toLowerCase().includes(term))
    );
    renderTable(filtered);
});

// ---------- AUTO REFRESH (60s) ----------
setInterval(fetchData, 60000);
fetchData();
</script>
</body>
</html>
